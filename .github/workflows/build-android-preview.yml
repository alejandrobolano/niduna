name: Build Android preview

on:
  push:
    branches:
      - master
    paths:
      - package.json
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the APK and notify Android users
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    environment: development
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v9
        with:
          eas-version: 27.1.0
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}
      - run: pnpm install --frozen-lockfile
      - name: Build published Android preview
        if: github.event_name == 'push' || inputs.publish == true
        run: pnpm run build:android:preview --non-interactive --no-wait
      - name: Build internal Android preview
        if: github.event_name == 'workflow_dispatch' && inputs.publish != true
        run: pnpm exec eas build --platform android --profile preview-internal --non-interactive --no-wait
