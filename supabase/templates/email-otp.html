<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tu código de acceso a Niduna</title>
  </head>
  <body style="background:#f7f3ff;margin:0;padding:24px;font-family:Arial,sans-serif;color:#342b4f">
    <table role="presentation" style="border-collapse:collapse;margin:0 auto;max-width:520px;width:100%">
      <tr>
        <td style="background:#ffffff;border:1px solid #e7def4;border-radius:24px;padding:36px;text-align:center">
          <p style="color:#f27877;font-size:12px;font-weight:700;letter-spacing:2px;margin:0 0 18px">
            NIDUNA
          </p>
          <h1 style="font-size:26px;line-height:1.2;margin:0 0 12px">Tu código de acceso</h1>
          <p style="color:#736b85;font-size:15px;line-height:1.6;margin:0 0 28px">
            Introduce este código en Niduna para continuar.
          </p>
          <p style="background:#eef9f7;border-radius:16px;color:#342b4f;font-size:34px;font-weight:800;letter-spacing:8px;margin:0;padding:20px">
            {{ .Token }}
          </p>
          <p style="color:#736b85;font-size:13px;line-height:1.6;margin:26px 0 0">
            El código es de un solo uso. Si no lo solicitaste, puedes ignorar este correo.
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
